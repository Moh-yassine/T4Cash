<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser votre mot de passe - T4Cash</title>
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
    .wrapper { max-width: 600px; margin: 0 auto; padding: 24px; }
    .banner { width: 100%; height: auto; display: block; border-radius: 8px; margin-bottom: 24px; }
    .card { background: #1e293b; border-radius: 16px; padding: 24px; margin-bottom: 24px; }
    h1 { font-size: 22px; margin: 0 0 16px; color: #f8fafc; }
    p { font-size: 15px; line-height: 1.6; color: #94a3b8; margin: 0 0 16px; }
    .button { display: inline-block; background: #14b8a6; color: #fff !important; text-decoration: none; padding: 14px 28px; border-radius: 12px; font-weight: 600; font-size: 16px; margin: 8px 0; }
    .footer { text-align: center; font-size: 12px; color: #64748b; margin-top: 24px; }
    .logo { text-align: center; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="logo">
      <img src="BANNER_URL" alt="T4Cash - Trade. Invest. Profit." class="banner" width="600" />
    </div>
    <div class="card">
      <h1>Réinitialisation du mot de passe</h1>
      <p>Vous avez demandé à réinitialiser votre mot de passe T4Cash. Cliquez sur le bouton ci-dessous.</p>
      <p><a href="{{ .ConfirmationURL }}" class="button">Réinitialiser mon mot de passe</a></p>
      <p style="font-size: 12px; color: #64748b;">Si vous n'êtes pas à l'origine de cette demande, ignorez cet email.</p>
    </div>
    <p class="footer">T4Cash · Trade. Invest. Profit.</p>
  </div>
</body>
</html>
